name: "Continuous Integration"

on:
  push: ~

jobs:
  build:
    environment: 'aws'
    runs-on: 'ubuntu-latest'

    steps:
      - uses: "actions/checkout@v7"

      - name: "Setup NodeJS"
        uses: "actions/setup-node@v7"
        with:
          node-version: '24'

      - name: 'Install'
        run: 'bin/install.sh'

      - name: 'Configure GitHub Actions problem matcher for TSC compilation errors'
        run: 'echo "::add-matcher::${{ github.workspace }}/.github/matchers/tsc.json"'

      - name: 'Compile'
        run: 'tsc --noEmit'

      - name: 'Test'
        run: 'bin/test.sh'
        env:
          AWS_ACCESS_KEY_ID: "${{ secrets.AWS_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          ANN_AWS_EVENT_BUS_ARN: "${{ secrets.ANN_AWS_EVENT_BUS_ARN }}"
          AWS_REGION: "${{ vars.AWS_REGION }}"

      - name: 'Upload coverage report'
        if: always()
        uses: 'actions/upload-artifact@v7'
        with:
          name: 'coverage-report'
          path: 'coverage'
